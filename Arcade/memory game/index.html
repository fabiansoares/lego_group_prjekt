<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#111026">
    <meta name="description" content="Find all eight pairs in Memory Match at Pixel Palace.">
    <title>Memory Match — Pixel Palace</title>
    <link rel="stylesheet" href="style.css">
    <script src="game.js" defer></script>
  </head>
  <body>
    <a class="back-to-arcade" href="../index.html">← Back to arcade</a>
    <main class="memory-page">
      <header class="game-header">
        <p class="eyebrow">PIXEL PALACE · GAME 02</p>
        <h1>Memory Match</h1>
        <p class="instructions">Flip two cards at a time. Find all eight pairs to win!</p>
      </header>

      <section class="game-panel" aria-label="Memory Match game">
        <div class="game-toolbar">
          <div class="game-stats" aria-label="Game statistics">
            <p class="stat-item"><span class="stat-label">Moves</span><strong id="move-count">0</strong></p>
            <p class="stat-item"><span class="stat-label">Time</span><strong id="timer-display">00:00</strong></p>
            <p class="stat-item"><span class="stat-label">Pairs</span><strong><span id="pair-count">0</span>/8</strong></p>
          </div>
          <button id="restart" class="restart-button" type="button">Shuffle &amp; restart</button>
        </div>
        <div id="memory-grid" class="memory-grid" role="group" aria-label="16 memory cards"></div>
        <p id="game-status" class="game-status" role="status" aria-live="polite" aria-atomic="true">
          Flip any two cards to find a pair.
        </p>
        <p class="sound-credit">
          Card flip sound: <a href="https://freesound.org/people/egomassive/sounds/536784/" target="_blank" rel="noopener noreferrer">“Deal” by egomassive</a>,
          based on “Card Flip” by F4ngy, licensed under
          <a href="https://creativecommons.org/licenses/by/3.0/" target="_blank" rel="noopener noreferrer">CC BY 3.0</a>.
        </p>
      </section>
      <dialog id="win-screen" class="win-screen" aria-labelledby="win-title">
        <p class="eyebrow">ALL PAIRS FOUND</p>
        <h2 id="win-title">You win!</h2>
        <p id="win-summary" class="win-summary"></p>
        <button id="play-again" class="restart-button" type="button">Play again</button>
      </dialog>
    </main>
  </body>
</html>
