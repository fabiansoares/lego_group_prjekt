<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Asteroid Hop — Pixel Palace</title>
<style>
html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #111026; touch-action: none; }
body { height: 100dvh; }
#game-container { position: fixed; inset: 0; width: 100%; height: 100%; }
canvas { display: block; width: 100%; height: 100%; touch-action: none; }
.arcade-link {
  position: fixed;
  z-index: 1000;
  top: 12px;
  left: 12px;
  display: inline-block;
  border: 1px solid rgb(69 232 224 / 55%);
  border-radius: 4px;
  padding: 8px 10px;
  background: rgb(17 16 38 / 88%);
  color: #45e8e0;
  font: 700 12px "Trebuchet MS", sans-serif;
  text-decoration: none;
}
.arcade-link:focus-visible {
  outline: 3px solid #ffe66d;
  outline-offset: 3px;
}
.pilot-name-input {
  position: fixed;
  z-index: 1100;
  display: none;
  box-sizing: border-box;
  border: 2px solid #71d2f4;
  border-radius: 4px;
  outline: none;
  background: #0b1c31;
  color: #ffffff;
  font: 16px "Trebuchet MS", sans-serif;
  text-align: center;
}
.pilot-name-input.is-visible {
  display: block;
}
</style>
</head>
<body>
<a class="arcade-link" href="../" aria-label="Return to the Pixel Palace arcade">&larr; Arcade</a>
<input id="pilot-name-input" class="pilot-name-input" type="text" maxlength="20" autocomplete="nickname" enterkeyhint="done" aria-label="Pilot name">
<div id="game-container"></div>
<script
src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
<script src="game.js?v=mobile-viewport-1"></script>
</body>
</html>
